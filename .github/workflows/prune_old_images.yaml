---
name: Prune old images
'on':
  pull_request: # TODO delete this trigger
  schedule:
  - cron: 0 0 * * 0 # weekly on Sundays
  workflow_dispatch:
    inputs:
      dry-run:
        description: list which tags would be pruned
        required: true
        type: boolean
concurrency:
  group: prune
jobs:
  prune-dockerhub:
    name: docker.io
    uses: ./.github/workflows/call_prune_container_registry.yaml
    with:
      api-url: https://hub.docker.com/v2
      api-type: docker-v2
      repository: netbrain/zwift # TOTDO ${{ github.repository }}
      username: none # TODO ${{ vars.DOCKERHUB_USERNAME }}
      dry-run: true # TODO &dry_run ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      keep-latest: true
      max-age: 365
    secrets:
      token: none # TODO ${{ secrets.DOCKERHUB_TOKEN }}
  prune-ghcr:
    name: ghcr.io
    uses: ./.github/workflows/call_prune_container_registry.yaml
    with:
      api-url: https://api.github.com
      api-type: github
      repository: ${{ github.repository }}
      username: ${{ github.repository_owner }}
      dry-run: false # TODO *dry_run
      keep-latest: true
      max-age: 4 # TODO set to a reasonable number, ie 30
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

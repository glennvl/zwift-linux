---
name: Prune ghcr
'on':
  workflow_call:
    inputs:
      dry-run:
        description: list which tags would be pruned
        default: false
        required: false
        type: boolean
      keep-latest:
        description: never delete latest tag
        default: true
        required: false
        type: boolean
      max-age:
        description: prune images older that max age days
        required: true
        type: number
      repository:
        description: repository to prune
        required: true
        type: string
      username:
        description: username for ghcr
        required: true
        type: string
    secrets:
      token:
        description: access token for ghcr
        required: true
jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    steps:
    - name: Collect tags
      env:
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        today="$(date +%F)"

        declare -a versions_array=()

        repository="$(basename "${REPO}")"
        response="$(curl -sf \
            "https://api.github.com/users/${USERNAME}/packages/container/${repository}/versions" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
        )"

        count="$(jq '.[] | .id' <<< "${response}" | wc -l)"
        for i in $(seq 0 $((count - 1))); do
            id="$(jq -r ".[${i}].id" <<< "${response}")"
            last_updated="$(jq -r ".[${i}].updated_at" <<< "${response}")"
            last_updated_day="$(date -ud "${last_updated}" +%F)"
            age_days="$((($(date -d "${today}" +%s) - $(date -d "${last_updated_day}" +%s)) / 86400))"
            tags="$(jq -r "[.[${i}].metadata.container.tags[]?] | join(\",\")" <<< "${response}")"
            versions_array+=("${id}:${age_days}:${tags}")
        done

        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Prune old tags
      env:
        DRYRUN: ${{ inputs.dry-run }}
        KEEP_LATEST: ${{ inputs.keep-latest }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        (
            echo "## Github Container Registry"
            echo ""
            echo "| Tag | Age (days) | Status |"
            echo "|:----|-----------:|:------:|"
        ) >> "${GITHUB_STEP_SUMMARY}"

        IFS=" " read -ra versions_array <<< "${VERSIONS}"
        if [[ ${#versions_array[@]} -eq 0 ]]; then
            echo "| - | - | - |" >> "${GITHUB_STEP_SUMMARY}"
        fi

        repository="$(basename "${REPO}")"

        deleted=0
        for id_age_tags in "${versions_array[@]}"; do
            IFS=":" read -ra id_age_tags_array <<< "${id_age_tags}"
            id="${id_age_tags_array[0]}"
            age="${id_age_tags_array[1]}"
            tags="${id_age_tags_array[2]}"
            IFS="," read -ra tags_array <<< "${tags}"

            if [[ ${KEEP_LATEST} == "true" ]] && [[ ",${tags}," == *,latest,* ]]; then
                status="🔒"
            elif [[ ${age} -le ${MAX_AGE_DAYS} ]]; then
                status="✔️"
            elif [[ ${DRYRUN} == "true" ]]; then
                status="🚫"
            elif http_code="$(curl -so /dev/null -w "%{http_code}" -X delete \
                "https://api.github.com/users/${USERNAME}/packages/container/${repository}/versions/${id}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
            )" && [[ ${http_code} -eq 204 ]]; then
                ((deleted+="${#tags_array[@]}")) || true
                status="🚫"
            else
                echo "::warning::Failed to delete ${USERNAME}/${repository}/versions/${id} (HTTP ${http_code})"
                status="⚠️"
            fi

            for tag in "${tags_array[@]}"; do
                echo "| ${USERNAME}/${repository}:${tag} | ${age} | ${status} |" >> "${GITHUB_STEP_SUMMARY}"
            done
        done

        (
            echo ""
            echo "Deleted ${deleted} tags."
            echo ""
            echo "(🔒 = Protected, ✔️ = Keep, 🚫 = Deleted, ⚠️ = Delete failed)"
        ) >> "${GITHUB_STEP_SUMMARY}"

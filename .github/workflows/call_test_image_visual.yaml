---
name: Zwift visual test
'on':
  workflow_call:
    inputs:
      image:
        description: zwift image to test
        required: true
        type: string
      registry:
        description: container registry
        default: ghcr.io
        required: false
        type: string
      username:
        description: username for container registry
        required: true
        type: string
    secrets:
      token:
        description: access token for container registry
        required: true
env:
  NUM_SCREENSHOTS: 30
jobs:
  test:
    name: Visual test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Install dependencies
      run: sudo apt-get install -y imagemagick x11-xserver-utils x11-apps
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          tests/zwift-visual-test/reference-screenshot.png
        sparse-checkout-cone-mode: false
    - name: Login to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ secrets.token }}
    - name: Start Zwift and capture screenshot
      env:
        IMAGE: ${{ inputs.image }}
        SCREENSHOT_DELAY: 1
      run: |
        xvfb-run --auto-servernum --server-args="-ac -screen 0 800x600x24" bash -ec "
            docker run \
                --rm \
                -d \
                --name zwift-visual-test \
                -e DISPLAY=\${DISPLAY} \
                -e XAUTHORITY=\${XAUTHORITY} \
                -e CONTAINER_TOOL=docker \
                -e ZWIFT_NO_GAMEMODE=1 \
                --device=/dev/dri \
                -v /tmp/.X11-unix:/tmp/.X11-unix \
                -v \${XAUTHORITY}:\${XAUTHORITY} \
                ${IMAGE}
            for i in \$(seq 1 ${NUM_SCREENSHOTS}); do
                echo \"Taking screenshot \${i} of ${NUM_SCREENSHOTS}\"
                import -window root zwift-screenshot-\$((i-1)).png
                sleep ${SCREENSHOT_DELAY}
            done
            docker kill zwift-visual-test
        "
    - name: Compare to reference screenshot
      env:
        MAX_DEVIATION: 5%
        IMAGE_MASK: rectangle 25,425 775,500
      run: |
        match_index="${NUM_SCREENSHOTS}"
        convert tests/zwift-visual-test/reference-screenshot.png -draw "${IMAGE_MASK}" reference-normalized.png
        for i in $(seq 0 "$((NUM_SCREENSHOTS-1))"); do
            convert "zwift-screenshot-${i}.png" -draw "${IMAGE_MASK}" screenshot-normalized.png
            if different_pixels="$(compare \
                -metric AE \
                -fuzz "${MAX_DEVIATION}" \
                reference-normalized.png \
                screenshot-normalized.png \
                screenshot-diff.png \
                2>&1 \
            )" && [[ ${different_pixels} == "0" ]]; then
                echo "Checking screenshot $((i+1)) of ${NUM_SCREENSHOTS}: MATCH"
                match_index="${i}"
                break
            else
                echo "Checking screenshot $((i+1)) of ${NUM_SCREENSHOTS}: NO MATCH"
            fi
        done
        if [[ ${match_index} -lt ${NUM_SCREENSHOTS} ]]; then
            echo "Found matching screenshot zwift-screenshot-${match_index}.png, test succeeded!"
            cp "zwift-screenshot-${match_index}.png" "matched-screenshot-${match_index}.png"
        else
            echo "::error::All screenshots differ from the reference image!"
            exit 1
        fi
    - name: Upload screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: zwift-screenshots
        path: '*.png'

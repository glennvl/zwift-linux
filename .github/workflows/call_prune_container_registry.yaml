---
name: Prune images from a container registry
'on':
  workflow_call:
    inputs:
      api-type:
        description: type of api (docker-v2 or github)
        required: true
        type: string
      api-url:
        description: container registry api url
        required: true
        type: string
      dry-run:
        description: list which tags would be pruned
        default: false
        required: false
        type: boolean
      keep-latest:
        description: never delete latest tag
        default: true
        required: false
        type: boolean
      max-age:
        description: prune images older that max age days
        required: true
        type: number
      repository:
        description: repository to prune
        required: true
        type: string
      username:
        description: username for container registry
        required: true
        type: string
    secrets:
      token:
        description: access token for the container registry
        required: true
env:
  GITHUB_API_VERSION: '2026-03-10'
  PAGE_SIZE: 100
jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Login to docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        if ! response="$(
            curl \
                --silent --show-error --fail \
                --request POST \
                --data "{\"username\":\"${USERNAME}\",\"password\":\"${TOKEN}\"}" \
                --header "Content-Type: application/json" \
                "${API_URL}/users/login" \
        )" || ! token="$(jq -r ".token" <<< "${response}")" || [[ -z ${token} ]] || [[ ${token} == "null" ]]; then
            echo "::error::Failed to authenticate with docker hub"
            exit 1
        fi

        echo "::add-mask::${token}"
        echo "JWT_TOKEN=${token}" >> "${GITHUB_ENV}"
    - name: Collect tags using docker api
      if: inputs.api-type == 'docker-v2'
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        REPO: ${{ inputs.repository }}
      run: |
        today="$(date +%F)"
        today_epoch="$(date -d "${today}" +%s)"
        repository="$(basename "${REPO}")"

        declare -a tags_array=()

        next_url="${API_URL}/repositories/${USERNAME}/${repository}/tags/?page_size=${PAGE_SIZE}&page=1"
        while [[ -n ${next_url} ]]; do
            if ! response_body="$(curl --silent --show-error --fail "${next_url}")"; then
                echo "::error::Failed to fetch tags"
                exit 1
            fi

            if ! tag_rows="$(jq -r '.results[]? | [.id, .name, .last_updated] | @tsv' <<< "${response_body}")"; then
                echo "::error::DockerHub returned invalid or unexpected data"
                exit 1
            fi

            if [[ -n ${tag_rows} ]]; then
                while IFS=$'\t' read -r image_id tag last_updated; do
                    last_updated_epoch="$(date -ud "${last_updated}" +%s)"
                    age_days="$(((today_epoch - last_updated_epoch) / 86400))"
                    tags_array+=("${image_id}:${tag}:${age_days}")
                done <<< "${tag_rows}"
            fi

            next_url="$(jq -r ".next // empty" <<< "${response}")"
        done

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Collect tags using github api
      if: inputs.api-type == 'github'
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        today="$(date +%F)"
        today_epoch="$(date -d "${today}" +%s)"
        repository="$(basename "${REPO}")"

        if [[ "${USERNAME}/${repository}" != "${REPO}" ]]; then
            echo "::warning::Pruning ${REPO}, but user ${USERNAME} is not the repository owner!"
        fi

        declare -a tags_array=()

        next_url="${API_URL}/users/${USERNAME}/packages/container/${repository}/versions?per_page=${PAGE_SIZE}&page=1"
        while [[ -n ${next_url} ]]; do
            response_body="$(mktemp)"

            if ! response_headers="$(
                curl \
                    --silent --show-error --fail \
                    --dump-header - \
                    --output "${response_body}" \
                    --header "Authorization: Bearer ${TOKEN}" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                    "${next_url}"
            )"; then
                echo "::error::Failed to fetch package versions"
                exit 1
            fi

            if ! tag_rows="$(
                jq -r '
                    .[] |
                    .id as $id |
                    .updated_at as $updated_at |
                    (.metadata.container.tags // []) as $tags |
                    if ($tags | length) == 0 then
                        [$id, "[untagged-\($id)]", $updated_at] | @tsv
                    else
                        $tags[] | [$id, ., $updated_at] | @tsv
                    end
                ' "${response_body}"
            )"; then
                echo "::error::GitHub returned invalid or unexpected data"
                exit 1
            fi

            if [[ -n ${tag_rows} ]]; then
                while IFS=$'\t' read -r image_id tag last_updated; do
                    last_updated_epoch="$(date -ud "${last_updated}" +%s)"
                    age_days="$(((today_epoch - last_updated_epoch) / 86400))"
                    tags_array+=("${image_id}:${tag}:${age_days}")
                done <<< "${tag_rows}"
            fi

            next_url=""
            if link_header="$(printf '%s\n' "${response_headers}" | grep -i '^Link:')"; then
                next_url="$(
                    printf '%s\n' "${link_header}" \
                        | tr ',' '\n' \
                        | sed -nE 's/.*<([^>]+)>[[:space:]]*;[[:space:]]*rel="next".*/\1/p' \
                        | head -n 1
                )"
            fi
        done

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Filter tags
      env:
        KEEP_LATEST: ${{ inputs.keep-latest }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
      run: |
        latest_id=""

        # filter based on age
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -r id tag age status <<< "${tags_array[$((i - 1))]}"
            status="keep"
            [[ ${tag} == "latest" ]] && latest_id="${id}"
            [[ ${age} -gt ${MAX_AGE_DAYS} ]] && status="delete"
            tags_array["$((i - 1))"]="${id}:${tag}:${age}:${status}"
        done

        # protect latest
        if [[ ${KEEP_LATEST} == "true" ]] && [[ -n ${latest_id} ]]; then
            for i in $(seq 1 ${#tags_array[@]}); do
                IFS=":" read -r id tag age _ <<< "${tags_array[$((i - 1))]}"
                [[ ${id} == "${latest_id}" ]] && tags_array["$((i - 1))"]="${id}:${tag}:${age}:protected"
            done
        fi

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        REPO: ${{ inputs.repository }}
      run: |
        repository="$(basename "${REPO}")"
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -r id tag age status <<< "${tags_array[$((i - 1))]}"
            [[ ${status} != "delete" ]] && continue
            if ! http_code="$(
                curl \
                    --silent \
                    --output /dev/null \
                    --write-out "%{http_code}" \
                    --request DELETE \
                    --header "Authorization: Bearer ${JWT_TOKEN}" \
                    "${API_URL}/repositories/${USERNAME}/${repository}/tags/${tag}/"
            )" || [[ ${http_code} -ne 204 ]]; then
                tags_array["$((i - 1))"]="${id}:${tag}:${age}:delete_failed"
                echo "::warning::Failed to delete ${USERNAME}/${repository}:${tag} (HTTP ${http_code})"
            fi
        done
        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using github api
      if: inputs.api-type == 'github' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        repository="$(basename "${REPO}")"
        declare -A deleted_versions
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -r id tag age status <<< "${tags_array[$((i - 1))]}"
            [[ ${status} != "delete" ]] && continue
            [[ -v deleted_versions["${id}"] ]] && continue
            if http_code="$(
                curl \
                    --silent \
                    --output /dev/null \
                    --write-out "%{http_code}" \
                    --request DELETE \
                    --header "Authorization: Bearer ${TOKEN}" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                    "${API_URL}/users/${USERNAME}/packages/container/${repository}/versions/${id}"
            )" && [[ ${http_code} -eq 204 ]]; then
                deleted_versions["${id}"]=1
            else
                tags_array["$((i - 1))"]="${id}:${tag}:${age}:delete_failed"
                echo "::warning::Failed to delete ${USERNAME}/${repository}:${tag} (HTTP ${http_code})"
            fi
        done
        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Report
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
        REPO: ${{ inputs.repository }}
      run: |
        if [[ ${DRY_RUN} == "true" ]]; then
            (echo "> Dry-run is active, no tags were actually deleted."; echo "") >> "${GITHUB_STEP_SUMMARY}"
        fi

        (
            echo "Pruned images from ${REPO} that are older than ${MAX_AGE_DAYS} days."
            echo ""
            echo "|Tag | Age (days) | Status |"
            echo "|---:|-----------:|:------:|"
        ) >> "${GITHUB_STEP_SUMMARY}"

        IFS=" " read -ra tags_array <<< "${TAGS}"
        if [[ ${#tags_array[@]} -eq 0 ]]; then
            echo "| - | - | - |" >> "${GITHUB_STEP_SUMMARY}"
        fi

        deleted=0
        for tag_info in "${tags_array[@]}" ; do
            IFS=":" read -r _ tag age status <<< "${tag_info}"
            case ${status} in
                "protected") status="🔒" ;;
                "keep") status="✔️" ;;
                "delete")
                    ((deleted++)) || true
                    if [[ ${DRY_RUN} == "true" ]]; then
                        status="🛇"
                    else
                        status="🚫"
                    fi
                    ;;
                "delete_failed") status="⚠️" ;;
                *) status="❓" ;;
            esac
            echo "| ${tag} | ${age} | ${status} |" >> "${GITHUB_STEP_SUMMARY}"
        done

        (echo ""; echo "(🔒 = Protected, ✔️ = Keep, 🚫 = Deleted, ⚠️ = Delete failed)"; echo "") >> "${GITHUB_STEP_SUMMARY}"

        if [[ ${DRY_RUN} == "true" ]]; then
            echo "Dry-run: Would delete ${deleted} tags." >> "${GITHUB_STEP_SUMMARY}"
        else
            echo "Deleted ${deleted} tags." >> "${GITHUB_STEP_SUMMARY}"
        fi

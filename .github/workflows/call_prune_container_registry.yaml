---
name: Prune images from a container registry
'on':
  workflow_call:
    inputs:
      api-type:
        description: type of api (docker-v2 or github)
        required: true
        type: string
      api-url:
        description: container registry api url
        required: true
        type: string
      dry-run:
        description: list which versions would be pruned
        default: false
        required: false
        type: boolean
      keep-latest:
        description: never delete latest version
        default: true
        required: false
        type: boolean
      max-age:
        description: prune versions older that max age days
        required: true
        type: number
      repository:
        description: repository to prune
        required: true
        type: string
      username:
        description: username for container registry
        required: true
        type: string
    secrets:
      token:
        description: access token for the container registry
        required: true
env:
  GITHUB_API_VERSION: '2026-03-10'
  PAGE_SIZE: 100
jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Login to docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        if ! response="$(
            curl \
                --silent --show-error --fail \
                --request POST \
                --data "{\"username\":\"${USERNAME}\",\"password\":\"${TOKEN}\"}" \
                --header "Content-Type: application/json" \
                "${API_URL}/users/login" \
        )" || ! token="$(jq -r ".token" <<< "${response}")" || [[ -z ${token} ]] || [[ ${token} == "null" ]]; then
            echo "::error::Failed to authenticate with docker hub"
            exit 1
        fi

        echo "::add-mask::${token}"
        echo "JWT_TOKEN=${token}" >> "${GITHUB_ENV}"
    - name: Collect tags using docker api
      if: inputs.api-type == 'docker-v2'
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        REPO: ${{ inputs.repository }}
      run: |
        repository="$(basename "${REPO}")"

        declare -a versions_array=()

        next_url="${API_URL}/repositories/${USERNAME}/${repository}/tags/?page_size=${PAGE_SIZE}&page=1"
        while [[ -n ${next_url} ]]; do
            if ! response_body="$(curl --silent --show-error --fail "${next_url}")"; then
                echo "::error::Failed to fetch tags"
                exit 1
            fi

            if ! tag_rows="$(jq -r '.results[]? | [.name, .name, .last_updated] | @tsv' <<< "${response_body}")"; then
                echo "::error::DockerHub returned invalid or unexpected data"
                exit 1
            fi

            if [[ -n ${tag_rows} ]]; then
                while IFS=$'\t' read -r image_id tag last_updated; do
                    updated_epoch="$(date -ud "${last_updated}" +%s)"
                    versions_array+=("${image_id}:${tag}:${updated_epoch}")
                done <<< "${tag_rows}"
            fi

            next_url="$(jq -r ".next // empty" <<< "${response}")"
        done

        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Collect tags using github api
      if: inputs.api-type == 'github'
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        repository="$(basename "${REPO}")"

        if [[ "${USERNAME}/${repository}" != "${REPO}" ]]; then
            echo "::warning::Pruning ${REPO}, but user ${USERNAME} is not the repository owner!"
        fi

        declare -a versions_array=()

        next_url="${API_URL}/users/${USERNAME}/packages/container/${repository}/versions?per_page=${PAGE_SIZE}&page=1"
        while [[ -n ${next_url} ]]; do
            response_body="$(mktemp)"

            if ! response_headers="$(
                curl \
                    --silent --show-error --fail \
                    --dump-header - \
                    --output "${response_body}" \
                    --header "Authorization: Bearer ${TOKEN}" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                    "${next_url}"
            )"; then
                echo "::error::Failed to fetch package versions"
                exit 1
            fi

            if ! tag_rows="$(
                jq -r '
                    .[] |
                    .id as $id |
                    .updated_at as $updated_at |
                    (.metadata.container.tags // []) as $tags |
                    (if ($tags | length) == 0 then "[untagged]-\($id)" else $tags | join(",") end) as $merged_tags |
                    [$id, $merged_tags, $updated_at] |
                    @tsv
                ' "${response_body}"
            )"; then
                echo "::error::GitHub returned invalid or unexpected data"
                exit 1
            fi

            if [[ -n ${tag_rows} ]]; then
                while IFS=$'\t' read -r image_id tag last_updated; do
                    updated_epoch="$(date -ud "${last_updated}" +%s)"
                    versions_array+=("${image_id}:${tag}:${updated_epoch}")
                done <<< "${tag_rows}"
            fi

            next_url=""
            if link_header="$(printf '%s\n' "${response_headers}" | grep -i '^Link:')"; then
                next_url="$(
                    printf '%s\n' "${link_header}" \
                        | tr ',' '\n' \
                        | sed -nE 's/.*<([^>]+)>[[:space:]]*;[[:space:]]*rel="next".*/\1/p' \
                        | head -n 1
                )"
            fi
        done

        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Filter tags
      env:
        KEEP_LATEST: ${{ inputs.keep-latest }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
      run: |
        IFS=" " read -ra versions_array <<< "${VERSIONS}"

        today="$(date +%F)"
        today_epoch="$(date -d "${today}" +%s)"

        for i in $(seq 1 ${#versions_array[@]}); do
            IFS=":" read -r id tag updated_epoch <<< "${versions_array[$((i - 1))]}"
            age_days="$(((today_epoch - updated_epoch) / 86400))"
            status="keep"
            [[ ${tag} == "[untagged]-${id}" ]] && status="delete"
            [[ ${age} -gt ${MAX_AGE_DAYS} ]] && status="delete"
            [[ ${KEEP_LATEST} == "true" ]] && [[ ",${tag}," == *,latest,* ]] && status="protected"
            versions_array["$((i - 1))"]="${id}:${tag}:${age_days}:${status}"
        done

        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        REPO: ${{ inputs.repository }}
      run: |
        repository="$(basename "${REPO}")"
        IFS=" " read -ra versions_array <<< "${VERSIONS}"
        for i in $(seq 1 ${#versions_array[@]}); do
            IFS=":" read -r id tag age status <<< "${versions_array[$((i - 1))]}"
            [[ ${status} != "delete" ]] && continue
            if ! http_code="$(
                curl \
                    --silent \
                    --output /dev/null \
                    --write-out "%{http_code}" \
                    --request DELETE \
                    --header "Authorization: Bearer ${JWT_TOKEN}" \
                    "${API_URL}/repositories/${USERNAME}/${repository}/tags/${id}/"
            )" || [[ ${http_code} -ne 204 ]]; then
                versions_array["$((i - 1))"]="${id}:${tag}:${age}:delete_failed"
                echo "::warning::Failed to delete ${USERNAME}/${repository}:${id} (HTTP ${http_code})"
            fi
        done
        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using github api
      if: inputs.api-type == 'github' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        repository="$(basename "${REPO}")"
        IFS=" " read -ra versions_array <<< "${VERSIONS}"
        for i in $(seq 1 ${#versions_array[@]}); do
            IFS=":" read -r id tags age status <<< "${versions_array[$((i - 1))]}"
            [[ ${status} != "delete" ]] && continue
            if ! http_code="$(
                curl \
                    --silent \
                    --output /dev/null \
                    --write-out "%{http_code}" \
                    --request DELETE \
                    --header "Authorization: Bearer ${TOKEN}" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                    "${API_URL}/users/${USERNAME}/packages/container/${repository}/versions/${id}"
            )" || [[ ${http_code} -ne 204 ]]; then
                versions_array["$((i - 1))"]="${id}:${tags}:${age}:delete_failed"
                echo "::warning::Failed to delete version ${id} (HTTP ${http_code})"
            fi
        done
        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Reduce version tags
      if: inputs.api-type == 'github'
      run: |
        IFS=" " read -ra versions_array <<< "${VERSIONS}"
        for i in $(seq 1 ${#versions_array[@]}); do
            IFS=":" read -r version tags age status <<< "${versions_array[$((i - 1))]}"
            tag_count=0
            if [[ ${tags} != "[untagged]-${version}" ]]; then
                IFS=',' read -ra tags_array <<< "${tags}"
                tag_count="${#tags_array[@]}"
            fi
            printf -v num_tags '%11s' "(${tag_count} tags)"
            versions_array["$((i - 1))"]="${version}:${version}${num_tags// /\\}:${age}:${status}"
        done
        echo "VERSIONS=${versions_array[*]}" >> "${GITHUB_ENV}"
    - name: Report
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
        REPO: ${{ inputs.repository }}
      run: |
        if [[ ${DRY_RUN} == "true" ]]; then
            (echo "> Dry-run is active, no tags were actually deleted."; echo "") >> "${GITHUB_STEP_SUMMARY}"
        fi

        (
            echo "Pruned versions from ${REPO} that are older than ${MAX_AGE_DAYS} days."
            echo ""
            echo "| Version | Age (days) | Status |"
            echo "|:--------|-----------:|:------:|"
        ) >> "${GITHUB_STEP_SUMMARY}"

        IFS=" " read -ra versions_array <<< "${VERSIONS}"
        if [[ ${#versions_array[@]} -eq 0 ]]; then
            echo "| - | - | - |" >> "${GITHUB_STEP_SUMMARY}"
        fi

        deleted=0
        for version_info in "${versions_array[@]}" ; do
            IFS=":" read -r _ version age status <<< "${version_info}"
            case ${status} in
                "protected") status="🔒" ;;
                "keep") status="✔️" ;;
                "delete")
                    ((deleted++)) || true
                    if [[ ${DRY_RUN} == "true" ]]; then
                        status="🛇"
                    else
                        status="🚫"
                    fi
                    ;;
                "delete_failed") status="⚠️" ;;
                *) status="❓" ;;
            esac
            echo "| \`${version//\\/ }\` | ${age} | ${status} |" >> "${GITHUB_STEP_SUMMARY}"
        done

        (echo ""; echo "(🔒 = Protected, ✔️ = Keep, 🚫 = Deleted, ⚠️ = Delete failed)"; echo "") >> "${GITHUB_STEP_SUMMARY}"

        if [[ ${DRY_RUN} == "true" ]]; then
            echo "Dry-run: Would delete ${deleted} versions." >> "${GITHUB_STEP_SUMMARY}"
        else
            echo "Deleted ${deleted} versions." >> "${GITHUB_STEP_SUMMARY}"
        fi

---
name: Prune images from a container registry
'on':
  workflow_call:
    inputs:
      api-type:
        description: type of api (docker-v2 or github)
        required: true
        type: string
      api-url:
        description: container registry api url
        required: true
        type: string
      dry-run:
        description: list which tags would be pruned
        default: false
        required: false
        type: boolean
      keep-latest:
        description: never delete latest tag
        default: true
        required: false
        type: boolean
      max-age:
        description: prune images older that max age days
        required: true
        type: number
      repository:
        description: repository to prune
        required: true
        type: string
      username:
        description: username for container registry
        required: true
        type: string
    secrets:
      token:
        description: access token for the container registry
        required: true
jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    steps:
    - name: Login to docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        token="$(curl -sf -X POST "${API_URL}/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${USERNAME}\",\"password\":\"${TOKEN}\"}" \
            | jq -r '.token')"

        if [[ -z ${token} ]] || [[ ${token} == "null" ]]; then
            echo "::error::Failed to authenticate with docker hub"
            exit 1
        fi

        echo "JWT_TOKEN=${token}" >> "${GITHUB_ENV}"
    - name: Collect tags using docker api
      if: inputs.api-type == 'docker-v2'
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
      run: |
        page_size=100
        page=1
        today="$(date +%F)"

        declare -a tags_array=()

        while true; do
            response="$(curl -sf "${API_URL}/repositories/${REPO}/tags/?page_size=${page_size}&page=${page}")"
            tags="$(jq -r ".results // []" <<< "${response}")"
            count="$(jq "length" <<< "${tags}")"
            [[ ${count} -eq 0 ]] && break

            for i in $(seq 0 $((count - 1))); do
                tag_id="$(jq -r ".[${i}].id" <<< "${tags}")"
                tag="$(jq -r ".[${i}].name" <<< "${tags}")"
                last_updated="$(jq -r ".[${i}].last_updated" <<< "${tags}")"
                last_updated_day="$(date -ud "${last_updated}" +%F)"
                tag_age_days=$((($(date -d "${today}" +%s) - $(date -d "${last_updated_day}" +%s)) / 86400))
                tags_array+=("${tag_id}:${tag}:${tag_age_days}")
            done

            next="$(jq -r ".next // empty" <<< "${response}")"
            [[ -z ${next} ]] && break
            ((page++)) || true
        done

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Collect tags using github api
      if: inputs.api-type == 'github'
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        today="$(date +%F)"

        declare -a tags_array=()

        repository="$(basename "${REPO}")"
        response="$(curl -sf \
            "${API_URL}/users/${USERNAME}/packages/container/${repository}/versions" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
        )"

        count="$(jq -r ".[] | .id" <<< "${response}" | wc -l)"
        for i in $(seq 0 $((count - 1))); do
            image_id="$(jq -r ".[${i}].id" <<< "${response}")"
            last_updated="$(jq -r ".[${i}].updated_at" <<< "${response}")"
            last_updated_day="$(date -ud "${last_updated}" +%F)"
            age_days="$((($(date -d "${today}" +%s) - $(date -d "${last_updated_day}" +%s)) / 86400))"
            tag_count="$(jq -r ".[${i}].metadata.container.tags[]" <<< "${response}" | wc -l)"
            for j in $(seq 0 $((tag_count - 1))); do
                tag="$(jq -r ".[${i}].metadata.container.tags[${j}]" <<< "${response}")"
                tags_array+=("${image_id}:${tag}:${age_days}")
            done
        done

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Filter tags
      env:
        KEEP_LATEST: ${{ inputs.keep-latest }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
      run: |
        latest_id=""

        # filter based on age
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -ra id_tag_age <<< "${tags_array[$((i - 1))]}"
            id="${id_tag_age[0]}"
            tag="${id_tag_age[1]}"
            age="${id_tag_age[2]}"
            status="keep"
            [[ ${tag} == "latest" ]] && latest_id="${id}"
            [[ ${age} -gt ${MAX_AGE_DAYS} ]] && status="delete"
            tags_array["$((i - 1))"]="${id}:${tag}:${age}:${status}"
        done

        # protect latest
        if [[ ${KEEP_LATEST} == "true" ]] && [[ -n ${latest_id} ]]; then
            for i in $(seq 1 ${#tags_array[@]}); do
                IFS=":" read -ra id_tag_age_status <<< "${tags_array[$((i - 1))]}"
                id="${id_tag_age_status[0]}"
                tag="${id_tag_age_status[1]}"
                age="${id_tag_age_status[2]}"
                [[ ${id} == "${latest_id}" ]] && tags_array["$((i - 1))"]="${id}:${tag}:${age}:protected"
            done
        fi

        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using docker api
      if: inputs.api-type == 'docker-v2' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
      run: |
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -ra id_tag_age_status <<< "${tags_array[$((i - 1))]}"
            id="${id_tag_age_status[0]}"
            tag="${id_tag_age_status[1]}"
            age="${id_tag_age_status[2]}"
            status="${id_tag_age_status[3]}"
            [[ ${status} != "delete" ]] && continue
            if ! http_code="$(curl -so /dev/null -w "%{http_code}" -X delete \
                "${API_URL}/repositories/${REPO}/tags/${tag}/" \
                -H "Authorization: Bearer ${JWT_TOKEN}" \
            )" || [[ ${http_code} -ne 204 ]]; then
                tags_array["$((i - 1))"]="${id}:${tag}:${age}:delete_failed"
                echo "::warning::Failed to delete ${REPO}:${tag} (HTTP ${http_code})"
            fi
        done
        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Delete tags using github api
      if: inputs.api-type == 'github' && ! inputs.dry-run
      env:
        API_URL: ${{ inputs.api-url }}
        REPO: ${{ inputs.repository }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ secrets.token }}
      run: |
        repository="$(basename "${REPO}")"
        declare -A deleted_versions
        IFS=" " read -ra tags_array <<< "${TAGS}"
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -ra id_tag_age_status <<< "${tags_array[$((i - 1))]}"
            id="${id_tag_age_status[0]}"
            tag="${id_tag_age_status[1]}"
            age="${id_tag_age_status[2]}"
            status="${id_tag_age_status[3]}"
            [[ ${status} != "delete" ]] && continue
            [[ -v deleted_versions["${id}"] ]] && continue
            if http_code="$(curl -so /dev/null -w "%{http_code}" -X delete \
                "${API_URL}/users/${USERNAME}/packages/container/${repository}/versions/${id}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
            )" && [[ ${http_code} -eq 204 ]]; then
                deleted_versions["${id}"]=1
            else
                tags_array["$((i - 1))"]="${id}:${tag}:${age}:delete_failed"
                echo "::warning::Failed to delete ${USERNAME}/${repository}:${tag} (HTTP ${http_code})"
            fi
        done
        echo "TAGS=${tags_array[*]}" >> "${GITHUB_ENV}"
    - name: Report
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        MAX_AGE_DAYS: ${{ inputs.max-age }}
        REPO: ${{ inputs.repository }}
      run: |
        if [[ ${DRY_RUN} == "true" ]]; then
            (echo "> Dry-run is active, no tags were actually deleted."; echo "") >> "${GITHUB_STEP_SUMMARY}"
        fi

        (
            echo "Pruned images from ${REPO} that are older than ${MAX_AGE_DAYS} days."
            echo ""
            echo "|Tag | Age (days) | Status |"
            echo "|:---|-----------:|:------:|"
        ) >> "${GITHUB_STEP_SUMMARY}"

        IFS=" " read -ra tags_array <<< "${TAGS}"
        if [[ ${#tags_array[@]} -eq 0 ]]; then
            echo "| - | - | - |" >> "${GITHUB_STEP_SUMMARY}"
        fi

        deleted=0
        for i in $(seq 1 ${#tags_array[@]}); do
            IFS=":" read -ra id_tag_age_status <<< "${tags_array[$((i - 1))]}"
            tag="${id_tag_age_status[1]}"
            age="${id_tag_age_status[2]}"
            status="${id_tag_age_status[3]}"

            case ${status} in
                "protected") status="🔒" ;;
                "keep") status="✔️" ;;
                "delete")
                    ((deleted++)) || true
                    status="🚫"
                    ;;
                "delete_failed") status="⚠️" ;;
                *) status="❓" ;;
            esac

            echo "| ${tag} | ${age} | ${status} |" >> "${GITHUB_STEP_SUMMARY}"
        done

        (
            echo ""
            echo "(🔒 = Protected, ✔️ = Keep, 🚫 = Deleted, ⚠️ = Delete failed)"
            echo ""
            echo "Deleted ${deleted} tags."
        ) >> "${GITHUB_STEP_SUMMARY}"

---
name: Deploy zwift image
'on':
  workflow_call:
    inputs:
      image:
        description: image to deploy
        required: true
        type: string
      registry:
        description: container registry to deploy to
        required: true
        type: string
      username:
        description: username for container registry
        required: true
        type: string
      repository:
        description: repository to deploy to
        required: true
        type: string
      tag:
        description: tag to create
        required: true
        type: string
    secrets:
      token:
        description: access token for container registry
        required: true
jobs:
  deploy:
    name: Deploy to container registry
    runs-on: ubuntu-latest
    steps:
    - name: Login to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ secrets.token }}
    - name: Deploy image
      id: deploy
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        REPO: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        docker pull "${IMAGE}"
        docker tag "${IMAGE}" "${REGISTRY}/${REPO}:${TAG}"
        docker tag "${IMAGE}" "${REGISTRY}/${REPO}:latest"
        docker push "${REGISTRY}/${REPO}:${TAG}"
        docker push "${REGISTRY}/${REPO}:latest"
        echo "Deployed Zwift image: ${REGISTRY}/${REPO}:${TAG}" >> "${GITHUB_STEP_SUMMARY}"

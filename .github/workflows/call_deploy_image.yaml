---
name: Deploy zwift image
'on':
  workflow_call:
    inputs:
      environment:
        description: deployment environment
        required: true
        type: string
      environment-url:
        description: container registry repository url
        required: false
        type: string
      registry:
        description: container registry to deploy to
        required: true
        type: string
      username:
        description: username for container registry
        required: true
        type: string
      repository:
        description: repository to deploy to
        required: true
        type: string
      tag:
        description: tag to create
        required: true
        type: string
    outputs:
      image:
        description: zwift image
        value: ${{ jobs.deploy.outputs.image }}
    secrets:
      token:
        description: access token for container registry
        required: true
jobs:
  deploy:
    name: Deploy to container registry
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    outputs:
      image: ${{ steps.deploy.outputs.image }}
    steps:
    - name: Import image
      id: import
      uses: $/.github/actions/docker-load-artifact
    - name: Login to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ secrets.token }}
    - name: Deploy image
      id: deploy
      env:
        IMAGE: ${{ steps.import.outputs.image }}
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        docker tag "${IMAGE}" "${REGISTRY}/${REPO}:${TAG}"
        docker tag "${IMAGE}" "${REGISTRY}/${REPO}:latest"
        docker push "${REGISTRY}/${REPO}:${TAG}"
        docker push "${REGISTRY}/${REPO}:latest"
        deployed_image="${REGISTRY}/${REPO}:${TAG}"
        echo "Deployed Zwift image: ${deployed_image}" >> "${GITHUB_STEP_SUMMARY}"
        echo "image=${deployed_image}" >> "${GITHUB_OUTPUT}"
